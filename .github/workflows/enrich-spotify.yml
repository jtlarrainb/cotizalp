name: Enrich Spotify IDs

on:
  workflow_dispatch:
  schedule:
    # Diario, fuera de horario punta. El catálogo tiene ~20k discos: esto avanza
    # hasta 1500 por corrida (ver scripts/fetch-spotify.mjs) hasta cubrirlo todo,
    # y luego solo procesa discos nuevos gracias al caché en scripts/.spotify-cache.json.
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/discos.json scripts/.spotify-cache.json
          git diff --cached --quiet || git commit -m "Actualizar IDs de Spotify"
          git diff --cached --quiet || git push
